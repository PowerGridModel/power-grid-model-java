plugins {
    id 'base'
    id 'org.jreleaser' version '1.26.0'
}

allprojects {
    group = 'org.lfenergy.powergridmodel'
    version = providers.gradleProperty('version').getOrElse('0.1.0-SNAPSHOT')
}

def stagingRepositoryDir = layout.buildDirectory.dir('staging-deploy')

jreleaser {
    signing {
        active = 'ALWAYS'
        armored = true
    }
    deploy {
        maven {
            mavenCentral {
                'release-deploy' {
                    active = 'RELEASE'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    applyMavenCentralRules = true
                    stagingRepository(stagingRepositoryDir.get().asFile.absolutePath)
                }
            }
        }
    }
}
